<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Knightfall - Prototype</title>
<style>
html,body{margin:0;background:#10121b;color:#eee;font-family:monospace;height:100%;overflow:hidden}
body{display:grid;place-items:center}
#wrap{position:relative;width:min(100vw,1100px);aspect-ratio:16/9}
canvas{width:100%;height:100%;image-rendering:pixelated;background:#18202d;border:2px solid #46506a;box-sizing:border-box}
#help{position:absolute;left:12px;bottom:10px;color:#d9d9df;font-size:14px;text-shadow:2px 2px #000}
#title{position:absolute;left:16px;top:10px;font-size:20px;color:#fff;text-shadow:2px 2px #000}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game" width="960" height="540"></canvas>
<div id="title">KNIGHTFALL — Prototype</div>
<div id="help">A/D or ←/→ Move • W/Space Jump • J Attack • K Block • Shift Dodge • R Potion</div>
</div>
<script>
const c=document.getElementById("game"),x=c.getContext("2d"); x.imageSmoothingEnabled=false;
const W=960,H=540,ground=438;
const keys={}; addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if([" ","arrowleft","arrowright","arrowup"].includes(e.key.toLowerCase()))e.preventDefault();});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

let knight={x:130,y:360,vx:0,vy:0,w:42,h:72,face:1,hp:100,max:100,stamina:100,attack:0,block:false,dodge:0,inv:0,potions:3};
let enemies=[
 {x:480,y:382,w:42,h:56,hp:45,max:45,vx:0,cd:0,dead:false},
 {x:700,y:390,w:38,h:48,hp:55,max:55,vx:0,cd:0,dead:false}
];
let loot={x:820,y:395,got:false};
let boss={x:900,y:302,w:100,h:136,hp:260,max:260,phase:1,cd:0,dead:false};
let camera=0, worldW=2600, particles=[], message="Find gear. Reach the Fallen King.";
let won=false, gameOver=false, gear={weapon:"Rusty Hammer",damage:12,armor:0};

function rect(a,b,cc,dd){x.fillStyle=cc;x.fillRect(a,b,dd||0,0)}
function box(px,py,w,h,col){x.fillStyle=col;x.fillRect(Math.round(px),Math.round(py),w,h)}
function text(t,px,py,size=16,col="#fff"){x.font=size+"px monospace";x.fillStyle=col;x.fillText(t,px,py)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function hit(a,b){return a.x<a.x+a.w && a.x+a.w>b.x && a.y<a.y+a.h && a.y+a.h>b.y}

function spawn(px,py,col,n=8){
 for(let i=0;i<n;i++)particles.push({x:px,y:py,vx:(Math.random()-.5)*5,vy:(Math.random()-.7)*5,life:25+Math.random()*20,col});
}
function reset(){
 knight={x:130,y:360,vx:0,vy:0,w:42,h:72,hp:100,max:100,stamina:100,attack:0,block:false,dodge:0,inv:0,potions:3};
 enemies=[{x:480,y:382,w:42,h:56,hp:45,max:45,vx:0,cd:0,dead:false},{x:700,y:390,w:38,h:48,hp:55,max:55,vx:0,cd:0,dead:false}];
 loot={x:820,y:395,got:false}; boss={x:900,y:302,w:100,h:136,hp:260,max:260,phase:1,cd:0,dead:false};
 camera=0;particles=[];won=false;gameOver=false;gear={weapon:"Rusty Hammer",damage:12,armor:0};message="Find gear. Reach the Fallen King.";
}

function update(){
 if(won||gameOver){if(keys["enter"])reset();return}
 knight.inv=Math.max(0,knight.inv-1); knight.attack=Math.max(0,knight.attack-1); knight.dodge=Math.max(0,knight.dodge-1);
 knight.stamina=Math.min(100,knight.stamina+.25);
 let left=keys["a"]||keys["arrowleft"], right=keys["d"]||keys["arrowright"];
 if((keys["shift"])&&knight.stamina>35&&knight.dodge===0&&!knight.block){knight.dodge=14;knight.inv=20;knight.stamina-=35;knight.vx=knight.face*8}
 if(knight.dodge===0){
   if(left){knight.vx=-3.4;knight.face=-1}
   else if(right){knight.vx=3.4;knight.face=1}
   else knight.vx*=.75;
   knight.block=!!(keys["k"]||keys["b"]);
   if((keys["w"]||keys[" "]||keys["arrowup"])&&knight.y>=ground-knight.h-1)knight.vy=-10;
   if(keys["j"]&&knight.attack===0){knight.attack=18;message="SMASH!";}
   if(keys["r"]&&knight.potions>0&&knight.hp<knight.max){knight.potions--;knight.hp=Math.min(knight.max,knight.hp+35);message="Potion restored 35 HP.";}
 }
 knight.vy+=.45;knight.x+=knight.vx;knight.y+=knight.vy;
 if(knight.y>ground-knight.h){knight.y=ground-knight.h;knight.vy=0}
 knight.x=clamp(knight.x,20,worldW-60);

 // Player attack
 if(knight.attack===12){
   let ax=knight.x+(knight.face>0?35:-65), ay=knight.y+15, aw=70;
   for(const e of enemies)if(!e.dead&&ax<e.x+e.w&&ax+aw>e.x&&ay<e.y+e.h&&ay+45>e.y){e.hp-=gear.damage; e.vx=knight.face*4;spawn(e.x+e.w/2,e.y+20,"#fff",6);if(e.hp<=0){e.dead=true;message="Enemy defeated — loot may drop.";}}
   if(!boss.dead&&ax<boss.x+boss.w&&ax+aw>boss.x&&ay<boss.y+boss.h&&ay+50>boss.y){boss.hp-=gear.damage;spawn(boss.x+50,boss.y+50,"#e33",8);message="The Fallen King staggers!";if(boss.hp<=0){boss.dead=true;won=true;}}
 }
 // Enemies
 for(const e of enemies){
   if(e.dead)continue;e.x+=e.vx;e.vx*=.85;e.cd=Math.max(0,e.cd-1);
   let dx=knight.x-e.x;
   if(Math.abs(dx)<240){e.vx+=Math.sign(dx)*.08;if(e.cd===0&&Math.abs(dx)<55){e.cd=65;if(knight.inv===0){let dmg=8;if(knight.block)dmg=2;knight.hp-=dmg;knight.inv=28;spawn(knight.x,knight.y+30,"#d55",5);}}}
 }
 if(!loot.got&&Math.abs(knight.x-loot.x)<45){loot.got=true;gear={weapon:"Frost Hammer",damage:32,armor:8};message="RARE LOOT! Frost Hammer: 32 damage, +8 armor.";knight.max=120;knight.hp=120;}
 // Boss appears only when near castle
 if(knight.x>1050&&!boss.dead){
   boss.cd=Math.max(0,boss.cd-1);
   let dx=knight.x-boss.x;
   if(Math.abs(dx)<320){boss.vx=(boss.vx||0)+Math.sign(dx)*.025;boss.vx=clamp(boss.vx,-1.2,1.2);boss.x+=boss.vx;
     if(boss.cd===0&&Math.abs(dx)<150){boss.cd=70;if(knight.inv===0){let dmg=boss.phase===1?16:24;if(knight.block)dmg=5;knight.hp-=dmg;knight.inv=30;spawn(knight.x,knight.y+25,"#f22",10);}}
     boss.phase=boss.hp<170?2:1;
   }
 }
 if(knight.hp<=0){knight.hp=0;gameOver=true}
 camera=clamp(knight.x-260,0,worldW-W);
 for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.life--}particles=particles.filter(p=>p.life>0);
}

function drawKnight(px,py){
 // shadow
 box(px-4,py+69,50,6,"#111");
 // legs
 box(px+8,py+51,10,18,"#6e431e");box(px+27,py+51,10,18,"#6e431e");
 box(px+5,py+66,16,6,"#2772dc");box(px+26,py+66,16,6,"#2772dc");
 // blue/white armor
 box(px+8,py+22,30,32,"#f1f1f1");box(px+5,py+28,10,24,"#447be0");box(px+28,py+28,11,20,"#447be0");
 box(px+12,py+20,22,7,"#4b82e8");
 // helmet
 box(px+9,py+2,27,20,"#f5f5f5");box(px+5,py+9,35,10,"#f5f5f5");box(px+12,py+1,18,7,"#f5f5f5");
 box(px+27,py+13,14,6,"#555b67");box(px+29,py+8,6,6,"#bfc3c8");
 // arm
 box(px+32,py+27,11,19,"#f2f2f2");box(px+38,py+30,8,13,"#3d76db");
 // hammer
 let fx=knight.face;
 x.save();x.translate(px+37,py+37);x.scale(fx,1);x.fillStyle="#7a4a20";x.fillRect(4,-3,50,7);
 x.fillStyle="#eee";x.fillRect(46,-16,23,28);x.fillStyle="#c8c8c8";x.fillRect(51,-20,14,5);x.fillStyle="#fff";x.fillRect(43,-11,9,18);x.restore();
}
function drawEnemy(e){
 box(e.x,e.y+e.h-7,e.w,7,"#111");box(e.x+9,e.y+15,24,e.h-18,"#c8c8c8");box(e.x+6,e.y+6,30,20,"#ddd");
 box(e.x+8,e.y+11,5,4,"#222");box(e.x+25,e.y+11,5,4,"#222");box(e.x+8,e.y+31,8,5,"#777");box(e.x+27,e.y+31,8,5,"#777");
 box(e.x-12,e.y+28,12,4,"#aaa");
 x.fillStyle="#ddd";x.fillRect(e.x+e.w+3,e.y+8,3,34);
 if(e.hp<e.max){box(e.x,e.y-9,e.w,5,"#333");box(e.x,e.y-9,e.w*(e.hp/e.max),5,"#d33")}
}
function drawBoss(){
 let b=boss,px=b.x;
 box(px+15,b.y+b.h-8,70,8,"#111");
 box(px+20,b.y+32,62,72,"#171923");box(px+28,b.y+16,48,35,"#252838");
 // horns/crown
 box(px+18,b.y+7,12,24,"#303342");box(px+70,b.y+7,12,24,"#303342");box(px+35,b.y,30,18,"#11131b");
 box(px+31,b.y+26,9,7,"#f22");box(px+61,b.y+26,9,7,"#f22");
 box(px+5,b.y+47,20,10,"#2b2e40");box(px+75,b.y+47,20,10,"#2b2e40");
 // giant sword
 x.save();x.translate(px+55,b.y+90);x.rotate(-.35);x.fillStyle="#aeb3c0";x.fillRect(0,-5,90,10);x.fillStyle="#e33";x.fillRect(82,-12,12,24);x.restore();
 if(b.hp<b.max){box(px,b.y-16,100,8,"#333");box(px,b.y-16,100*(b.hp/b.max),8,"#d33")}
 text("THE FALLEN KING",px-12,b.y-25,13,"#fff");
}
function draw(){
 x.clearRect(0,0,W,H);
 // sky
 let grad=x.createLinearGradient(0,0,0,H);grad.addColorStop(0,"#121827");grad.addColorStop(1,"#2a2630");x.fillStyle=grad;x.fillRect(0,0,W,H);
 x.save();x.translate(-camera,0);
 // background trees/buildings
 for(let i=0;i<worldW;i+=120){box(i,300,35,138,"#172b2d");box(i+25,330,45,108,"#1d3333");box(i+6,270,60,50,"#162526");}
 // areas
 box(0,390,380,48,"#4a4a4a");box(380,390,430,48,"#353b2c");box(810,390,340,48,"#40342d");box(1150,390,900,48,"#302b34");
 for(let i=0;i<worldW;i+=40)box(i,438,40,102,(i%80===0)?"#25232a":"#2b2930");
 // village sign
 text("FORGOTTEN VILLAGE",50,365,18,"#ddd");
 text("DARK FOREST",455,365,18,"#91b36d");
 text("CURSED MINES",830,365,18,"#c89b74");
 text("FALLEN CASTLE",1200,365,18,"#d98a8a");
 // castle silhouette
 box(1850,200,260,190,"#17151e");for(let i=0;i<5;i++)box(1840+i*65,150-(i%2)*20,45,240,"#191722");
 text("ABYSS",2140,300,24,"#d55");
 // loot
 if(!loot.got){box(loot.x-12,loot.y+5,24,18,"#a86b22");box(loot.x-15,loot.y+1,30,7,"#e2a63c");box(loot.x-7,loot.y-12,14,14,"#6ec8ff");}
 for(const e of enemies)if(!e.dead)drawEnemy(e);
 if(!boss.dead&&knight.x>1000)drawBoss();
 drawKnight(knight.x,knight.y);
 for(const p of particles)box(p.x,p.y,4,4,p.col);
 x.restore();

 // HUD
 box(15,35,250,78,"#111923");box(25,48,200,12,"#34333a");box(25,48,200*(knight.hp/knight.max),12,"#d83b46");
 text("HP "+knight.hp+"/"+knight.max,30,45,13,"#fff");
 box(25,70,200,8,"#34333a");box(25,70,200*(knight.stamina/100),8,"#4c8de8");
 text("♥ Potion x"+knight.potions,30,104,14,"#f5b85c");
 text(gear.weapon+"  DMG "+gear.damage+"  ARM "+gear.armor,285,50,15,"#dfe8ff");
 if(message)text(message,285,72,14,"#fff");
 if(boss.phase===2&&!boss.dead&&knight.x>1000)text("PHASE 2 — ENRAGED",700,45,16,"#f56");

 if(won){box(170,145,620,240,"#0b1019ee");text("THE FALLEN KING IS DEFEATED!",235,205,28,"#fff");text("You collected the gear and conquered the Abyss.",245,245,16,"#ddd");text("Press ENTER to play again",335,310,16,"#8dc6ff");}
 if(gameOver){box(230,165,500,190,"#0b1019ee");text("YOU HAVE FALLEN",335,225,32,"#e66");text("Press ENTER to try again",340,285,16,"#fff");}
}
function loop(){update();draw();requestAnimationFrame(loop)} loop();
</script>
</body></html>
